name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: "FOR Android"

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    env:
      # 放到 job 级别，下面的步骤才能在 if 条件里判断它是否配置了。
      KEYSTORE_BASE64: ${{ secrets.ECM_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 计算版本号
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="1.0-$(git rev-parse --short HEAD)"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # 仓库里配了 ECM_KEYSTORE_BASE64 才会用正式签名，否则 release 包用 debug 签名。
      - name: 还原签名 keystore
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "path=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"

      - name: 编译 debug 与 release
        env:
          ECM_VERSION_NAME: ${{ steps.version.outputs.name }}
          ECM_VERSION_CODE: ${{ steps.version.outputs.code }}
          ECM_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ECM_KEYSTORE_PASSWORD: ${{ secrets.ECM_KEYSTORE_PASSWORD }}
          ECM_KEY_ALIAS: ${{ secrets.ECM_KEY_ALIAS }}
          ECM_KEY_PASSWORD: ${{ secrets.ECM_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: 整理产物
        id: artifacts
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ecm-${V}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/ecm-${V}-release.apk"
          {
            echo "## 安卓构建产物"
            echo ""
            echo "版本 \`${V}\` · versionCode \`${{ steps.version.outputs.code }}\`"
            echo ""
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            if [ -z "${{ steps.keystore.outputs.path }}" ]; then
              echo ""
              echo "> release 包使用 debug 签名（仓库未配置 \`ECM_KEYSTORE_BASE64\`）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: ecm-apk-${{ steps.version.outputs.name }}
          path: "FOR Android/dist/*.apk"
          retention-days: 30
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # iOS 工作流可能已经先建好了同一个 Release，这时改成往上追加文件。
          gh release create "$TAG" dist/*.apk \
            --title "元件库 $TAG" \
            --generate-notes \
          || gh release upload "$TAG" dist/*.apk --clobber
